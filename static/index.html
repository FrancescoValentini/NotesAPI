
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Notes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">📝 My Notes</a>
        <div id="userArea" class="d-none">
            <span id="usernameDisplay" class="text-white me-3"></span>
            <button class="btn btn-outline-light btn-sm"
                    onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div id="alertArea"></div>

    <!-- Authentication -->
    <div id="authSection" class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4" id="authTitle">
                        Login
                    </h3>

                    <form id="authForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username"
                                   class="form-control" required minlength="3">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password"
                                   class="form-control" required minlength="8">
                        </div>

                        <button type="submit" class="btn btn-primary w-100"
                                id="authButton">
                            Login
                        </button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        <span id="authToggleText">Don't have an account?</span>
                        <a href="#" id="authToggle">Register</a>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <!-- Notes Dashboard -->
    <div id="notesSection" class="d-none">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold">My Notes</h2>
                <p class="text-muted mb-0">Manage your personal notes.</p>
            </div>

            <button class="btn btn-primary" onclick="openCreateModal()">
                + New Note
            </button>
        </div>

        <div id="notesContainer" class="row g-3">
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
            <h4>No notes yet</h4>
            <p class="text-muted">Create your first note!</p>
        </div>

    </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal fade" id="noteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Create Note</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="noteForm">
                    <input type="hidden" id="noteId">

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="noteTitle"
                               class="form-control"
                               maxlength="255" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Content</label>
                        <textarea id="noteContent"
                                  class="form-control"
                                  rows="5"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Save Note
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
